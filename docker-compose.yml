services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kenza
      POSTGRES_PASSWORD: kenza
      POSTGRES_DB: kenza
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kenza"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: node:20
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "cd apps/api && npm install && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: node:20
    working_dir: /app
    volumes:
      - .:/app
    # PLACEHOLDER en attendant l'Etape H (BullMQ)
    command: sh -c "echo worker en attente Etape H && sleep infinity"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:20
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "cd apps/web && npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata: